name: Keep demo awake

# Free Render web services spin down after 15 minutes without inbound traffic, and the next visitor waits
# about a minute for a cold start. Pinging the API every 10 minutes keeps the live demo responsive.
# GitHub runs scheduled workflows on the default branch only, on a best-effort basis (runs can be delayed),
# and disables them after 60 days without repository activity.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Override with repository variables if the services get different URLs.
      API_URL: ${{ vars.BRIGHTLOOP_API_URL || 'https://brightloop-odoo-api.onrender.com' }}
      WEB_URL: ${{ vars.BRIGHTLOOP_WEB_URL || 'https://brightloop-odoo-web.onrender.com' }}
    steps:
      - name: Ping API health (wakes it if asleep)
        run: curl --fail --silent --show-error --retry 4 --retry-delay 15 --retry-all-errors --max-time 90 "$API_URL/health"
      - name: Check frontend is reachable
        run: curl --fail --silent --show-error --output /dev/null --max-time 30 "$WEB_URL/"
